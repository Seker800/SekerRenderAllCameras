[project]
name = "camera-batch-renderer"
version = "0.1.0"
description = "Render still images from every camera in a Blender scene"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
