[project]
name = "camera-batch-renderer"
version = "0.4.1"
description = "Render still images from every camera in a Blender scene"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
